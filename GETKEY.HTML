<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get Free Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#7C4DFF;--acc2:#00E5FF;--acc3:#FF4081;
  --ok:#00E676;--err:#FF5252;--warn:#FFAB40;
  --txt:#eaeaf5;--muted:#8a8aa5;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:#04040a;color:var(--txt);
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 25%,rgba(0,0,0,.6) 100%);}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.4;z-index:1;pointer-events:none;}
.orb.a{width:420px;height:420px;background:#7C4DFF;top:-140px;left:-120px;animation:orbFloat 18s ease-in-out infinite;}
.orb.b{width:380px;height:380px;background:#00E5FF;bottom:-160px;right:-100px;animation:orbFloat 22s ease-in-out infinite reverse;}
.orb.c{width:320px;height:320px;background:#FF4081;top:35%;left:55%;animation:orbFloat 26s ease-in-out infinite;}
@keyframes orbFloat{
  0%,100%{transform:translate(0,0) scale(1);}
  33%{transform:translate(90px,-70px) scale(1.15);}
  66%{transform:translate(-70px,80px) scale(.88);}
}

/* ---------- STAGE ---------- */
.stage{position:relative;z-index:5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px;}
.card-shell{position:relative;width:100%;max-width:520px;
  opacity:0;transform:translateY(46px) scale(.93);filter:blur(14px);
  animation:shellIn 1s cubic-bezier(.22,1,.36,1) .15s forwards;}
@keyframes shellIn{to{opacity:1;transform:none;filter:blur(0);}}
.ring{position:absolute;inset:-3px;border-radius:32px;z-index:0;
  background:conic-gradient(from 0deg,#7C4DFF,#00E5FF,#FF4081,#FFAB40,#7C4DFF);
  animation:spin 6s linear infinite;filter:blur(16px);opacity:.55;}
@keyframes spin{to{transform:rotate(360deg);}}
.card{position:relative;z-index:2;
  background:
    radial-gradient(circle at 30% 0%,rgba(124,77,255,.13),transparent 45%),
    radial-gradient(circle at 70% 100%,rgba(0,229,255,.09),transparent 45%),
    linear-gradient(165deg,rgba(22,22,38,.94),rgba(8,8,16,.97));
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;padding:34px 28px 26px;
  backdrop-filter:blur(24px);
  box-shadow:0 34px 90px rgba(0,0,0,.75);
  overflow:hidden;text-align:center;}

.badge{display:inline-flex;align-items:center;gap:8px;
  padding:7px 16px;border-radius:30px;font-size:10px;font-weight:800;letter-spacing:2.2px;
  background:rgba(124,77,255,.12);border:1px solid rgba(124,77,255,.35);color:#c9b6ff;
  position:relative;z-index:2;animation:badgePulse 2.6s ease-in-out infinite;}
.badge-dot{width:6px;height:6px;border-radius:50%;background:#00E5FF;box-shadow:0 0 10px #00E5FF;animation:blink 1.4s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.25;}}
@keyframes badgePulse{0%,100%{box-shadow:0 0 0 0 rgba(124,77,255,.4);}50%{box-shadow:0 0 0 10px rgba(124,77,255,0);}}

.logo-wrap{position:relative;width:104px;height:104px;margin:22px auto 18px;z-index:2;}
.logo-ring{position:absolute;inset:-6px;border-radius:50%;
  background:conic-gradient(from 0deg,#7C4DFF,#00E5FF,#FF4081,#7C4DFF);
  animation:spin 4s linear infinite;filter:blur(7px);opacity:.8;}
.logo{position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(145deg,#1a1a2e,#08080f);
  border:2px solid rgba(124,77,255,.6);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;font-weight:900;letter-spacing:1px;
  color:#fff;text-shadow:0 0 24px rgba(124,77,255,.9);
  box-shadow:inset 0 0 40px rgba(124,77,255,.35);
  background-size:cover;background-position:center;
  overflow:hidden;
  animation:logoIn 1.1s cubic-bezier(.22,1,.36,1) .35s both, floatY 4.5s ease-in-out 1.5s infinite;}
@keyframes logoIn{0%{transform:scale(.2) rotate(-180deg);opacity:0;}100%{transform:scale(1) rotate(0);opacity:1;}}
@keyframes floatY{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

.title{position:relative;z-index:2;font-size:26px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#A855F7,#00E5FF,#FF4081,#A855F7);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:titleShift 5s linear infinite, floatY 5s ease-in-out infinite;
  text-transform:uppercase;}
@keyframes titleShift{to{background-position:300% 0;}}
.subtitle{position:relative;z-index:2;font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.65;font-weight:500;}

.divider{position:relative;z-index:2;height:1px;margin:22px 0;overflow:hidden;
  background:rgba(255,255,255,.06);border-radius:2px;}
.divider::after{content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;
  background:linear-gradient(90deg,transparent,#7C4DFF,#00E5FF,transparent);
  animation:slideLine 3s linear infinite;}
@keyframes slideLine{to{left:120%;}}

.info-row{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px;}
.info-chip{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;padding:12px 10px;transition:all .3s;}
.info-chip:hover{border-color:rgba(124,77,255,.5);transform:translateY(-2px);}
.ic-label{font-size:9px;letter-spacing:1.8px;color:var(--muted);font-weight:800;}
.ic-val{font-size:14px;font-weight:900;margin-top:5px;color:#00E5FF;font-family:'JetBrains Mono',monospace;}

.panel{position:relative;z-index:2;}
.panel.hide{display:none;}

.gen-btn{position:relative;width:100%;padding:19px 24px;border:none;border-radius:18px;
  cursor:pointer;font-family:inherit;font-size:14px;font-weight:900;letter-spacing:3px;
  color:#fff;text-transform:uppercase;overflow:hidden;
  background:linear-gradient(135deg,#7C4DFF,#A855F7,#7C4DFF);
  background-size:220% 100%;
  box-shadow:0 0 30px rgba(124,77,255,.55),0 14px 40px rgba(124,77,255,.28),inset 0 2px 0 rgba(255,255,255,.25);
  animation:btnGrad 3.5s linear infinite, btnPulse 2.4s ease-in-out infinite;
  transition:transform .25s;}
@keyframes btnGrad{to{background-position:220% 0;}}
@keyframes btnPulse{
  0%,100%{box-shadow:0 0 30px rgba(124,77,255,.55),0 14px 40px rgba(124,77,255,.28),inset 0 2px 0 rgba(255,255,255,.25);}
  50%{box-shadow:0 0 52px rgba(124,77,255,.95),0 18px 55px rgba(124,77,255,.42),inset 0 2px 0 rgba(255,255,255,.25);}}
.gen-btn:hover{transform:translateY(-3px) scale(1.02);}
.gen-btn:active{transform:translateY(0) scale(.99);}
.btn-shine{position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);
  transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite;}
@keyframes shine{0%{left:-60%;}55%,100%{left:130%;}}
.btn-text{position:relative;z-index:2;}
.btn-spinner{display:none;position:absolute;left:50%;top:50%;width:20px;height:20px;
  margin:-10px 0 0 -10px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;z-index:2;}
.gen-btn.loading .btn-text{opacity:0;}
.gen-btn.loading .btn-spinner{display:block;}
.gen-btn.loading{animation:btnGrad 3.5s linear infinite;pointer-events:none;opacity:.9;}
.note{font-size:11px;color:var(--muted);margin-top:12px;line-height:1.6;}

.key-box{position:relative;z-index:2;display:none;margin-top:6px;}
.key-box.show{display:block;animation:keyIn .7s cubic-bezier(.22,1,.36,1);}
@keyframes keyIn{0%{opacity:0;transform:perspective(700px) rotateX(-75deg) scale(.85);}100%{opacity:1;transform:none;}}
.key-label{font-size:9.5px;letter-spacing:2.4px;color:var(--muted);font-weight:800;margin-bottom:10px;}
.key-value{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:800;letter-spacing:1.5px;
  color:#fff;padding:18px 14px;border-radius:16px;
  background:rgba(0,0,0,.45);border:1px solid rgba(0,229,255,.35);
  word-break:break-all;animation:keyGlow 2.6s ease-in-out infinite;}
@keyframes keyGlow{
  0%,100%{box-shadow:0 0 26px rgba(0,229,255,.22),inset 0 0 26px rgba(0,229,255,.06);}
  50%{box-shadow:0 0 46px rgba(0,229,255,.55),inset 0 0 34px rgba(0,229,255,.12);}}
.key-actions{display:flex;gap:10px;margin-top:12px;}
.copy-btn,.login-btn{flex:1;padding:13px 10px;border-radius:13px;border:none;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:900;letter-spacing:1.6px;text-decoration:none;
  display:flex;align-items:center;justify-content:center;transition:all .25s;}
.copy-btn{background:linear-gradient(135deg,#00C853,#00E676);color:#04040a;}
.login-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#d5d5e8;}
.copy-btn:hover,.login-btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.5);}

.cooldown{position:relative;z-index:2;display:none;margin-top:4px;}
.cooldown.show{display:block;animation:keyIn .7s cubic-bezier(.22,1,.36,1);}
.cd-title{font-size:10px;letter-spacing:2.4px;color:#FFAB40;font-weight:800;margin-bottom:14px;}
.cd-timer{display:flex;align-items:center;justify-content:center;gap:6px;}
.cd-unit{background:rgba(0,0,0,.45);border:1px solid rgba(255,171,64,.3);border-radius:13px;
  padding:10px 6px;min-width:62px;flex:1;}
.cd-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:800;color:#FFAB40;}
.cd-num.flip{animation:flipNum .45s cubic-bezier(.22,1,.36,1);}
@keyframes flipNum{0%{transform:rotateX(-90deg) scale(1.3);opacity:0;}100%{transform:none;opacity:1;}}
.cd-lbl{font-size:8px;letter-spacing:1.4px;color:var(--muted);font-weight:800;margin-top:4px;}
.cd-sep{color:rgba(255,171,64,.5);font-weight:900;font-size:16px;}

.footer{position:relative;z-index:2;margin-top:24px;font-size:9.5px;letter-spacing:2px;
  color:rgba(138,138,165,.6);font-weight:700;text-transform:uppercase;}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(140px);
  padding:13px 26px;border-radius:14px;font-size:12.5px;font-weight:800;z-index:999;
  background:linear-gradient(135deg,#00C853,#00E676);color:#04040a;
  box-shadow:0 16px 44px rgba(0,230,118,.4);
  transition:transform .45s cubic-bezier(.68,-.55,.27,1.55);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.err{background:linear-gradient(135deg,#D32F2F,#FF5252);color:#fff;box-shadow:0 16px 44px rgba(255,82,82,.4);}

.confetti{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:998;
  animation:confettiFly 1.4s cubic-bezier(.2,.7,.4,1) forwards;}
@keyframes confettiFly{
  0%{transform:translate(-50%,-50%) scale(0) rotate(0deg);opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--rot));opacity:0;}}

@media(max-width:480px){
  .card{padding:28px 18px 22px;border-radius:24px;}
  .title{font-size:21px;letter-spacing:1.4px;}
  .key-value{font-size:14px;letter-spacing:1px;}
  .cd-unit{min-width:0;padding:8px 4px;}
  .cd-num{font-size:18px;}
}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div class="vignette"></div>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="orb c"></div>

<div class="stage">
  <div class="card-shell">
    <div class="ring"></div>
    <div class="card">

      <div class="badge"><span class="badge-dot"></span>FREE KEY SYSTEM</div>

      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <!-- LOGO — background-image will be set from CFG.logoUrl -->
        <div class="logo" id="logo">FX</div>
      </div>

      <h1 class="title" id="title">GET FREE KEY</h1>
      <p class="subtitle" id="subtitle">Generate your free license key instantly</p>

      <div class="divider"></div>

      <div class="info-row">
        <div class="info-chip">
          <div class="ic-label">KEY DURATION</div>
          <div class="ic-val" id="infoDur">24 HOURS</div>
        </div>
        <div class="info-chip">
          <div class="ic-label">COOLDOWN</div>
          <div class="ic-val" id="infoCd">24 HOURS</div>
        </div>
      </div>

      <div class="panel" id="panel">
        <button class="gen-btn" id="genBtn">
          <span class="btn-shine"></span>
          <span class="btn-spinner"></span>
          <span class="btn-text" id="genBtnText">GENERATE KEY</span>
        </button>
        <div class="note" id="note">One key per device per cooldown period</div>
      </div>

      <div class="key-box" id="keyBox">
        <div class="key-label">YOUR LICENSE KEY</div>
        <div class="key-value" id="keyValue"></div>
        <div class="key-actions">
          <button class="copy-btn" id="copyBtn">COPY KEY</button>
          <a class="login-btn" id="loginBtn" href="#">GO TO LOGIN</a>
        </div>
      </div>

      <div class="cooldown" id="cooldown">
        <div class="cd-title">NEXT KEY AVAILABLE IN</div>
        <div class="cd-timer">
          <div class="cd-unit"><div class="cd-num" id="cdD">00</div><div class="cd-lbl">DAYS</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-num" id="cdH">00</div><div class="cd-lbl">HRS</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-num" id="cdM">00</div><div class="cd-lbl">MIN</div></div>
          <div class="cd-sep">:</div>
          <div class="cd-unit"><div class="cd-num" id="cdS">00</div><div class="cd-lbl">SEC</div></div>
        </div>
      </div>

      <div class="footer" id="footer">Encrypted · Secure Connection</div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG ================= */
const DB_URL = "https://syco-key-store-default-rtdb.firebaseio.com";

const DEFAULT_CFG = {
  enabled:true,
  title:"GET FREE KEY",
  subtitle:"Generate your free license key instantly",
  description:"One key per device per cooldown period.",
  keyPrefix:"SYCO",
  keyHours:24,
  cooldownHours:24,
  buttonText:"GENERATE KEY",
  footer:"Encrypted · Secure Connection",
  logoUrl:"",              /* <-- NEW: logo URL from admin */
  url:""
};

let CFG = {...DEFAULT_CFG};
let claim = null;
let cooldownInt = null;
let generating = false;

/* ================= DEVICE ID ================= */
function getDeviceId(){
  let id = localStorage.getItem("fx_device_id");
  if(!id){
    id = "DEV-" + Math.random().toString(36).slice(2,8).toUpperCase()
       + "-" + Date.now().toString(36).toUpperCase();
    localStorage.setItem("fx_device_id", id);
  }
  return id;
}
const DEVICE_ID = getDeviceId();

/* ================= FIREBASE ================= */
async function fbGet(p){
  try{ const r = await fetch(DB_URL + p + ".json"); return await r.json(); }
  catch(e){ return null; }
}
async function fbPut(p,d){
  try{
    const r = await fetch(DB_URL + p + ".json",{
      method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(d)
    });
    return await r.json();
  }catch(e){ return null; }
}

/* ================= BACKGROUND ================= */
const canvas = document.getElementById("bgCanvas");
const ctx = canvas.getContext("2d");
let cw, ch, pts = [];

function resizeCanvas(){
  cw = canvas.width  = window.innerWidth;
  ch = canvas.height = window.innerHeight;
  pts = [];
  const n = Math.min(85, Math.floor((cw*ch)/24000));
  for(let i=0;i<n;i++){
    pts.push({
      x:Math.random()*cw, y:Math.random()*ch,
      vx:(Math.random()-.5)*.55, vy:(Math.random()-.5)*.55,
      r:Math.random()*1.8+.6
    });
  }
}
window.addEventListener("resize", resizeCanvas);

function drawBg(){
  ctx.fillStyle = "rgba(4,4,10,.3)";
  ctx.fillRect(0,0,cw,ch);

  for(let i=0;i<pts.length;i++){
    for(let j=i+1;j<pts.length;j++){
      const a = pts[i], b = pts[j];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if(d < 135){
        ctx.strokeStyle = "rgba(124,77,255," + (0.18*(1-d/135)) + ")";
        ctx.lineWidth = .6;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      }
    }
  }
  for(const p of pts){
    p.x += p.vx; p.y += p.vy;
    if(p.x < 0 || p.x > cw) p.vx *= -1;
    if(p.y < 0 || p.y > ch) p.vy *= -1;
    ctx.fillStyle = "rgba(0,229,255,.7)";
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
  }
  requestAnimationFrame(drawBg);
}
resizeCanvas();
drawBg();

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let toastTimer;
function toast(msg, err){
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.className = "toast"; }, 2600);
}

function setNum(id, val){
  const el = $(id);
  if(el.textContent === val) return;
  el.textContent = val;
  el.classList.remove("flip");
  void el.offsetWidth;
  el.classList.add("flip");
}

function makeKey(prefix){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for(let i=0;i<9;i++){
    if(i > 0 && i % 3 === 0) s += "-";
    s += chars[Math.floor(Math.random()*chars.length)];
  }
  return (prefix || "SYCO").toUpperCase() + "-" + s;
}

/* ================= APPLY CONFIG ================= */
function applyConfig(){
  $("title").textContent    = CFG.title;
  $("subtitle").textContent = CFG.subtitle;
  $("infoDur").textContent  = CFG.keyHours + " HOUR" + (CFG.keyHours > 1 ? "S" : "");
  $("infoCd").textContent   = CFG.cooldownHours + " HOUR" + (CFG.cooldownHours > 1 ? "S" : "");
  $("genBtnText").textContent = CFG.buttonText;
  $("note").textContent     = CFG.description;
  $("footer").textContent   = CFG.footer;
  document.title            = CFG.title;
  if(CFG.url) $("loginBtn").href = CFG.url;

  /* ---- LOGO ---- */
  const logoEl = $("logo");
  const url = (CFG.logoUrl || "").trim();
  if(url){
    logoEl.style.backgroundImage = "url('" + url + "')";
    logoEl.textContent = "";
    logoEl.style.fontSize = "0";
  } else {
    logoEl.style.backgroundImage = "";
    logoEl.style.fontSize = "32px";
    logoEl.textContent = (CFG.keyPrefix || "FX").slice(0,2).toUpperCase();
  }
}

/* ================= STATE ================= */
function showPanel(){
  $("panel").classList.remove("hide");
  $("cooldown").classList.remove("show");
  $("keyBox").classList.remove("show");
}

function showKey(code, animate){
  const box = $("keyBox");
  const val = $("keyValue");
  box.classList.add("show");
  if(animate){
    val.textContent = "";
    let i = 0;
    const iv = setInterval(()=>{
      val.textContent += code[i];
      i++;
      if(i >= code.length) clearInterval(iv);
    }, 42);
  } else {
    val.textContent = code;
  }
}

function startCooldown(nextAt){
  $("panel").classList.add("hide");
  $("cooldown").classList.add("show");

  if(cooldownInt) clearInterval(cooldownInt);

  const tick = () => {
    const diff = nextAt - Date.now();
    if(diff <= 0){
      clearInterval(cooldownInt);
      cooldownInt = null;
      showPanel();
      toast("You can generate a new key now!");
      return;
    }
    const s = Math.floor(diff/1000);
    setNum("cdD", String(Math.floor(s/86400)).padStart(2,"0"));
    setNum("cdH", String(Math.floor((s%86400)/3600)).padStart(2,"0"));
    setNum("cdM", String(Math.floor((s%3600)/60)).padStart(2,"0"));
    setNum("cdS", String(s%60).padStart(2,"0"));
  };
  tick();
  cooldownInt = setInterval(tick, 1000);
}

/* ================= CONFETTI ================= */
function burstConfetti(){
  const colors = ["#7C4DFF","#00E5FF","#FF4081","#00E676","#FFAB40","#FFFFFF"];
  const r = $("genBtn").getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  for(let i=0;i<56;i++){
    const p = document.createElement("div");
    p.className = "confetti";
    p.style.left = cx + "px";
    p.style.top  = cy + "px";
    p.style.background = colors[i % colors.length];
    const ang  = Math.random()*Math.PI*2;
    const dist = 90 + Math.random()*240;
    p.style.setProperty("--dx", (Math.cos(ang)*dist) + "px");
    p.style.setProperty("--dy", (Math.sin(ang)*dist) + "px");
    p.style.setProperty("--rot", (Math.random()*720-360) + "deg");
    p.style.animationDelay = (Math.random()*0.16) + "s";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 1800);
  }
}

/* ================= CHECK STATE ================= */
async function checkState(){
  claim = await fbGet("/getkey_claims/" + DEVICE_ID);

  if(claim && claim.nextAt && Date.now() < claim.nextAt){
    if(claim.key) showKey(claim.key, false);
    startCooldown(claim.nextAt);
  } else {
    showPanel();
  }
}

/* ================= GENERATE ================= */
async function generate(){
  if(generating) return;
  generating = true;

  const btn = $("genBtn");
  btn.classList.add("loading");
  $("genBtnText").textContent = "GENERATING...";

  const fresh = await fbGet("/getkey_claims/" + DEVICE_ID);
  if(fresh && fresh.nextAt && Date.now() < fresh.nextAt){
    claim = fresh;
    generating = false;
    btn.classList.remove("loading");
    $("genBtnText").textContent = CFG.buttonText;
    if(fresh.key) showKey(fresh.key, false);
    startCooldown(fresh.nextAt);
    toast("Cooldown active — please wait", true);
    return;
  }

  await sleep(1300);

  let code = null;
  for(let i=0;i<6;i++){
    const c = makeKey(CFG.keyPrefix);
    const exists = await fbGet("/keys/" + c);
    if(!exists){ code = c; break; }
  }
  if(!code){
    generating = false;
    btn.classList.remove("loading");
    $("genBtnText").textContent = CFG.buttonText;
    toast("Generation failed, try again", true);
    return;
  }

  const now    = Date.now();
  const cdMs   = CFG.cooldownHours * 3600 * 1000;

  await fbPut("/getkey_claims/" + DEVICE_ID, {
    deviceId: DEVICE_ID,
    key: code,
    lastClaimAt: now,
    nextAt: now + cdMs,
    totalClaims: ((fresh && fresh.totalClaims) || 0) + 1,
    ua: navigator.userAgent.slice(0,140)
  });

  await fbPut("/keys/" + code, {
    status: "active",
    duration: { value: CFG.keyHours, unit: "hours" },
    deviceLimit: 1,
    devices: {},
    activated: false,
    startedAt: 0,
    expiresAt: 0,
    createdAt: now,
    notes: "Auto via Get Key (" + DEVICE_ID + ")"
  });

  claim = { key: code, lastClaimAt: now, nextAt: now + cdMs };

  generating = false;
  btn.classList.remove("loading");
  $("genBtnText").textContent = CFG.buttonText;

  showKey(code, true);
  burstConfetti();
  toast("Key generated successfully!");
  startCooldown(now + cdMs);
}

/* ================= COPY ================= */
function copyKey(){
  const code = $("keyValue").textContent.trim();
  if(!code) return;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code)
      .then(()=>toast("Key copied!"))
      .catch(()=>fallbackCopy(code));
  } else {
    fallbackCopy(code);
  }
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.top = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, text.length);
  try{
    document.execCommand("copy");
    toast("Key copied!");
  }catch(e){
    prompt("Copy your key:", text);
  }
  document.body.removeChild(ta);
}

/* ================= INIT ================= */
async function init(){
  const remote = await fbGet("/config/getKey");
  if(remote){
    CFG = Object.assign({}, DEFAULT_CFG, remote);
  }
  applyConfig();

  if(CFG.enabled === false){
    $("panel").innerHTML =
      '<div style="padding:16px;border-radius:14px;background:rgba(255,82,82,.1);' +
      'border:1px solid rgba(255,82,82,.3);color:#FF8A80;font-size:12.5px;font-weight:700;">' +
      'Key generation is currently disabled.</div>';
    return;
  }

  await checkState();

  setInterval(async ()=>{
    if(cooldownInt) return;
    const c = await fbGet("/getkey_claims/" + DEVICE_ID);
    if(c && c.nextAt && Date.now() < c.nextAt){
      claim = c;
      if(c.key) showKey(c.key, false);
      startCooldown(c.nextAt);
    }
  }, 60000);
}

$("genBtn").addEventListener("click", generate);
$("copyBtn").addEventListener("click", copyKey);

init();
</script>
